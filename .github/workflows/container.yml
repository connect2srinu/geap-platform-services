name: Container

on:
  pull_request:
    paths:
      - "patterns/*/examples/Dockerfile"
      - "templates/container-build/**"
      - "patterns/*/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Reference build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the reference image
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patterns/*/examples/Dockerfile)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No reference Dockerfile present yet — skipped, not passed."
            exit 0
          fi
          for f in "${files[@]}"; do
            dir=$(dirname "$(dirname "$f")")
            name=$(basename "$dir")
            if grep -q '<BASE_IMAGE_DIGEST>' "$f"; then
              echo "::notice::$name — Dockerfile is a template with an unpinned base. Build UNAVAILABLE."
              continue
            fi
            echo "== building $name"
            docker build -f "$f" -t "geap-reference/$name:ci" "$dir"
          done

      # The image is built to prove a domain CAN build it. It is never pushed:
      # domain teams own their images and registries.
