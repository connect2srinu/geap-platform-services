name: Pattern conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.4 -r scripts/requirements.txt

      - name: Report conformance suite state per pattern
        run: |
          set -euo pipefail
          for dir in patterns/*/; do
            name=$(basename "$dir")
            [ -d "$dir/conformance" ] || { echo "::error::$name has no conformance/ directory"; exit 1; }
            count=$(find "$dir/conformance" -name 'test_*.py' | wc -l)
            status=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('$dir/pattern.yaml'))['metadata']['status'])")
            if [ "$count" -eq 0 ]; then
              if [ "$status" = "proposed" ]; then
                echo "::notice::$name — conformance suite empty (status: proposed). UNAVAILABLE, not passed."
              else
                echo "::error::$name — status '$status' requires a populated conformance suite"
                exit 1
              fi
            else
              echo "$name — running $count conformance test file(s)"
              pytest -q "$dir/conformance"
            fi
          done

      # NOTE: this job runs the suite against the reference implementation. It does NOT and
      # CANNOT verify that an adopting domain runs it against their build. See
      # standards/pattern-contract.md on the limits of enforcement.
