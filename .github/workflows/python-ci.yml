name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.8.4
      - run: ruff check patterns scripts templates
      - run: ruff format --check patterns scripts templates

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          python -m pip install mypy==1.14.0
          types-PyYAML==6.0.12.20250915 types-jsonschema==4.25.1.20250822
      - name: Type check pattern source
        run: |
          shopt -s nullglob
          checked=0
          for pattern in patterns/*/; do
            # A src/ holding only a README is not Python to check: skip it rather than fail.
            [ -n "$(find "$pattern/src" -name '*.py' -print -quit 2>/dev/null)" ] || continue
            # The pattern's own dependencies must be installed, or mypy reports every third-party
            # import as missing and the real errors are buried. Run from inside the pattern so its
            # own mypy configuration applies.
            python -m pip install -q -e "$pattern"
            ( cd "$pattern" && mypy --strict src )
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "No pattern source present yet — skipped, not passed."
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.4 -r scripts/requirements.txt
      - name: Install each pattern with its dev dependencies
        run: |
          shopt -s nullglob
          for pattern in patterns/*/; do
            [ -f "$pattern/pyproject.toml" ] && python -m pip install -q -e "$pattern[dev]"
          done
      # The conformance suite runs here against the reference implementation. A domain runs the
      # same suite against their own build; this proves the suite itself still works, so it cannot
      # rot unnoticed between releases.
      - name: Run tests
        run: |
          shopt -s nullglob
          dirs=(patterns/*/tests patterns/*/conformance tests)
          existing=()
          for d in "${dirs[@]}"; do [ -d "$d" ] && existing+=("$d"); done
          if [ ${#existing[@]} -eq 0 ]; then
            echo "No test directories present yet — skipped, not passed."
            exit 0
          fi
          # pytest exits 5 when it collects nothing: skipped, not passed. Any other failure fails.
          rc=0
          pytest -q "${existing[@]}" || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No tests collected yet — skipped, not passed."
            exit 0
          fi
          exit "$rc"
