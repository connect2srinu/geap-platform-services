name: Design artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDLC design artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Validate design artifacts
        run: python3 scripts/validate_design_artifacts.py

      - name: Release-track commit check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          python3 scripts/check_release_commit.py --base "origin/${{ github.base_ref }}"
      # This job verifies that artifacts EXIST and are WELL-FORMED and INTERNALLY CONSISTENT.
      # It cannot verify that a human read or approved anything. That is GitHub required
      # reviews plus CODEOWNERS -- see docs/operations/repository-administration.md.
