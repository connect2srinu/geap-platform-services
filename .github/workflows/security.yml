name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so that newly disclosed vulnerabilities surface without a code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit validation dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: scripts/requirements.txt

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits through the API to choose the scan range, which
    # contents: read alone does not allow (403 "Resource not accessible by integration").
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub's own secret scanning and push protection are enabled in repository
      # settings by an administrator; this job does not replace them.

  iac:
    name: Infrastructure policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          skip_check: CKV_GCP_NONE
