# Domain-owned CI/CD pipeline. Copy to .github/workflows/ in the DOMAIN's repository.
#
# OWNERSHIP: the domain team owns this pipeline, its registry and its deployments.
#
# The conformance step is the domain's demonstration that its customization still honours
# the pattern contract. The platform team CANNOT observe whether this runs -- which is
# precisely why it matters. See standards/pattern-contract.md on the limits of enforcement.

name: Domain CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation -- never a downloaded key file

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy extensions/
      - run: pytest -q tests/

  pattern-conformance:
    name: Pattern conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r scripts/requirements.txt
      - name: Verify the pinned pattern version has not drifted
        run: python3 scripts/verify_pattern_lock.py
      - name: Run the pattern conformance suite
        run: pytest -q vendor/pattern/conformance/
        # A conformance suite that collects no tests is NOT a pass.
      - name: Fail if no conformance tests ran
        run: |
          count=$(pytest --collect-only -q vendor/pattern/conformance/ 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          if [ "$count" -eq 0 ]; then
            echo "::error::conformance suite collected 0 tests -- this is unavailable, not a pass"
            exit 1
          fi

  security:
    name: Dependency, secret and IaC scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependency vulnerabilities
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terraform policy scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform init -backend=false
      - run: terraform -chdir=infrastructure/terraform validate

  build:
    name: Build and scan image
    needs: [quality, pattern-conformance, security]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: |
          docker build \
            -t "${{ vars.IMAGE_REPO }}:${{ github.sha }}" \
            .

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.IMAGE_REPO }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1" # a failing scan blocks the push

      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${{ vars.IMAGE_REPO }}:${{ github.sha }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ vars.IMAGE_REPO }}:${{ github.sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are configured in GitHub by a repository
    # administrator. The workflow file alone does not gate anything.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Apply
        run: |
          terraform -chdir=infrastructure/terraform init
          terraform -chdir=infrastructure/terraform apply -auto-approve \
            -var="container_image=${{ needs.build.outputs.digest }}"

      - name: Smoke test
        run: python3 scripts/smoke_test.py --base-url "${{ vars.SERVICE_URL }}"
