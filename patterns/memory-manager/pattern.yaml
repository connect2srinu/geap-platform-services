apiVersion: platform.geap/v1
kind: Pattern

metadata:
  name: memory-manager
  version: 0.1.0
  description: Domain-owned governed memory tool API over a managed Memory Bank, with topic policy, read-back verification and per-domain quota budgeting.
  maintainer:
    team: agent-platform
    contact: agent-platform@geap.example
  # ALPHA: the design is approved and implemented, and the service has been verified against
  # a real Memory Bank. Adoptable by a pilot domain. The contract may still change.
  status: alpha

spec:
  runtime:
    language: python
    version: "3.12"
    container:
      base: <pinned-base-image>
      port: 8080
      nonRoot: true

  interfaces:
    - kind: openapi
      spec: patterns/memory-manager/contracts/openapi.yaml
      version: v1
      status: active
    # MCP is a planned second transport over the SAME contract and semantics,
    # never a second contract. Deliberately not stubbed.
    - kind: mcp
      version: v1
      status: planned

  configuration:
    schema: patterns/memory-manager/src/memory_manager/config.schema.json
    examples:
      - patterns/memory-manager/config/example.domain.yaml

  extensionPoints:
    - id: pii-classifier
      interface: patterns/memory-manager/src/memory_manager/extensions/pii_classifier.py
      required: true
      default: deny-all
      failureMode: deny
      description: Classifies a candidate value before persistence. The OBLIGATION to classify is platform; the vocabulary is domain. Defaults to deny-all so that an unconfigured deployment stores nothing.

    - id: policy-provider
      interface: patterns/memory-manager/src/memory_manager/extensions/policy_provider.py
      required: true
      default: deny-all
      failureMode: deny
      description: Resolves caller role and scope to a permit/deny decision. May refine a platform decision, never override a platform denial.

    - id: topic-provider
      interface: patterns/memory-manager/src/memory_manager/extensions/topic_provider.py
      required: false
      default: yaml-config
      failureMode: deny
      description: Supplies the domain's topic vocabulary. The default reads the validated YAML configuration; a domain needing runtime topic changes supplies its own. A provider that cannot answer leaves every topic unknown, and an unknown topic is rejected.

    - id: entity-resolver
      interface: patterns/memory-manager/src/memory_manager/extensions/entity_resolver.py
      required: false
      default: noop
      failureMode: skip
      description: Resolves an entity reference to a domain-internal identifier. Domain identity resolution; the platform default is a no-op pass-through.


  secrets:
    - name: SUBJECT_HMAC_KEY
      purpose: Pseudonymises end-user subjects before they reach a scope, a log, a metric or an audit event. Without it the service refuses to start, because a missing key would silently give every user the same pseudonym.
      required: true

  cloudPermissions:
    google:
      - component: api
        roles:
          - logging.logEntries.create
          - monitoring.timeSeries.create
          - cloudtrace.traces.patch
          - roles/secretmanager.secretAccessor
        # Granted as a CUSTOM role, not a predefined one: the predefined Vertex AI roles carry far
        # more than this service needs. Memory bank access itself is granted by platform-owned
        # Terraform, to this identity only, with an IAM Condition limiting it to the domain's bank.

  infrastructure:
    # The one control that survives a domain forking this source. See standards/pattern-contract.md.
    platformOwned: patterns/memory-manager/infrastructure/terraform/memory-bank-nfr
    domainOwned: patterns/memory-manager/infrastructure/terraform/domain-runtime

  security:
    nonOverridableControls:
      - C-01
      - C-02
      - C-05
      - C-06
      - C-07
      - C-08
      - C-11
      - C-16
    dataClassification:
      - public
      - internal
      - sensitive
      - restricted

  observability:
    requiredMetrics:
      - tool_invocations
      - tool_latency
      - facts_evaluated
      - policy_denials
      - verification_outcomes
      - remediations
      - recall_withheld
      - provider_requests
      - provider_throttled
      - quota_consumed
      - quota_budget_exhausted
      - extension_errors
    # Exactly what the service emits, no more. `role_grant` and `role_revocation` were
    # declared here and removed on 2026-10-24: this service never grants or revokes a role, so
    # declaring them asserted a responsibility it cannot discharge. A test compares this list
    # against the code in both directions, so neither can drift from the other again.
    requiredAuditEvents:
      - memory_write
      - memory_recall
      - memory_deletion
      - memory_remediation
      - memory_write_unverified
      - policy_denial
      - configuration_change
      - exception_invoked
      - idempotency_replay
    prohibitedLogFields:
      - memory_content
      - pii
      - sensitive_value
      - restricted_value
      - secrets
      - authorization_header
      - provider_error_body

  build:
    instructions: patterns/memory-manager/docs/build.md
    dockerfile: patterns/memory-manager/examples/Dockerfile
    ownedBy: domain

  tests:
    unit: patterns/memory-manager/tests
    conformance: patterns/memory-manager/conformance

  compatibility:
    terraform: ">=1.9"
    google: "~>7.45"
    memoryBankSdk: "google-cloud-aiplatform[agent_engines]==2.3.0"
    python: ">=3.12"

  upgrade:
    from: []
    guide: patterns/memory-manager/docs/upgrade.md
